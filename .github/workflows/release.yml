name: Release

# A tag vX.Y.Z builds, tests and checks the plugin, then leaves a DRAFT release
# with the wheel and the notes. Publishing the draft (by a person: GitHub's
# page or `gh release edit vX.Y.Z --draft=false`) releases it, and
# publish-orcacloud.yml, started by that, publishes it on OrcaCloud: OrcaCloud
# only accepts runs started by a published release, and a release published
# by this workflow's own token would start no workflow.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test
        run: |
          python -m pip install -e . -r requirements-dev.txt
          python -m pytest -q
      - name: Build
        run: |
          python -m pip install build
          python -m build
          python tools/check_wheel.py dist/*.whl
      - name: Version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python -c "import sys; sys.path.insert(0, 'src'); from orca_svg_multicor._version import __version__; print(__version__)")
          test "$tag" = "$ver" || { echo "tag $tag != version $ver"; exit 1; }
      - name: Release notes from CHANGELOG.md and CHANGELOG.pt-BR.md
        run: |
          ver="${GITHUB_REF_NAME#v}"
          section() { awk -v v="## $ver" '$0==v{on=1;next} /^## /{if(on)exit} on' "$1"; }
          section CHANGELOG.md > notes_en.md
          section CHANGELOG.pt-BR.md > notes_pt.md
          test -s notes_en.md || echo "See CHANGELOG.md" > notes_en.md
          {
            cat notes_en.md
            if [ -s notes_pt.md ]; then
              printf '\n---\n\n**Português (Brasil)**\n'
              cat notes_pt.md
            fi
          } > notes.md
      - name: Draft release on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.whl --draft --title "SVG Multicolor $GITHUB_REF_NAME" --notes-file notes.md
          echo "Draft release ready: publish it to release $GITHUB_REF_NAME on GitHub and OrcaCloud." >> "$GITHUB_STEP_SUMMARY"
