name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write      # OrcaCloud trusted publishing (GitHub OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test
        run: |
          python -m pip install -e . -r requirements-dev.txt
          python -m pytest -q
      - name: Build
        run: |
          python -m pip install build
          python -m build
          python tools/check_wheel.py dist/*.whl
      - name: Version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python -c "import sys; sys.path.insert(0, 'src'); from orca_svg_multicor._version import __version__; print(__version__)")
          test "$tag" = "$ver" || { echo "tag $tag != version $ver"; exit 1; }
      - name: Release notes from CHANGELOG.md and CHANGELOG.pt-BR.md
        run: |
          ver="${GITHUB_REF_NAME#v}"
          section() { awk -v v="## $ver" '$0==v{on=1;next} /^## /{if(on)exit} on' "$1"; }
          section CHANGELOG.md > notes_en.md
          section CHANGELOG.pt-BR.md > notes_pt.md
          test -s notes_en.md || echo "See CHANGELOG.md" > notes_en.md
          {
            cat notes_en.md
            if [ -s notes_pt.md ]; then
              printf '\n---\n\n**Português (Brasil)**\n'
              cat notes_pt.md
            fi
          } > notes.md
      - name: Publish on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.whl \
            --title "SVG Multicolor $GITHUB_REF_NAME" --notes-file notes.md

      # OrcaCloud is where OrcaSlicer's Plugins dialog takes a plugin's image and
      # changelog from. Enabled once the plugin exists on OrcaCloud and this
      # repository is connected to it (Edit plugin > GitHub publishing), by
      # setting the repository variable ORCACLOUD_PUBLISH to "true".
      # OrcaCloud wants a target suffix in the file name ("_any" = every OS).
      # publish-orcacloud.yml publishes an existing release by hand.
      - name: Publish on OrcaCloud
        if: vars.ORCACLOUD_PUBLISH == 'true'
        run: |
          cp dist/orca_svg_multicor-*-py3-none-any.whl dist/orca_svg_multicor_any.whl
          bash tools/publish_orcacloud.sh "${GITHUB_REF_NAME#v}" notes.md dist/orca_svg_multicor_any.whl
