name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test
        run: |
          python -m pip install -e . -r requirements-dev.txt
          python -m pytest -q
      - name: Build
        run: |
          python -m pip install build
          python -m build
          python tools/check_wheel.py dist/*.whl
      - name: Version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python -c "import sys; sys.path.insert(0, 'src'); from orca_svg_multicor._version import __version__; print(__version__)")
          test "$tag" = "$ver" || { echo "tag $tag != version $ver"; exit 1; }
      - name: Release notes from CHANGELOG.md
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="## $ver" '$0==v{on=1;next} /^## /{if(on)exit} on' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md" > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.whl \
            --title "SVG Multicolor $GITHUB_REF_NAME" --notes-file notes.md
