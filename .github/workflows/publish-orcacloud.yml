name: Publish on OrcaCloud

# Publishing a GitHub release publishes it on OrcaCloud, with its wheel and its
# notes (GitHub trusted publishing: no token or secret). OrcaCloud accepts only
# runs started by a published release, from the repository connected to the
# plugin (Edit plugin > GitHub publishing). Enabled by the repository variable
# ORCACLOUD_PUBLISH = "true". To publish a release again, turn it into a draft
# and publish it again; OrcaCloud refuses a version it already has.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write      # the GitHub OIDC token OrcaCloud checks

jobs:
  publish:
    if: vars.ORCACLOUD_PUBLISH == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Wheel and notes of the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --pattern '*-py3-none-any.whl' --dir dist
          gh release view "$TAG" --json body --jq .body > notes.md
          # OrcaCloud wants a target suffix in the file name ("_any" = every OS)
          cp dist/orca_svg_multicor-*-py3-none-any.whl dist/orca_svg_multicor_any.whl
      - name: Publish
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: bash tools/publish_orcacloud.sh "${TAG#v}" notes.md dist/orca_svg_multicor_any.whl
