<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>/*CSS*/</style>
<script>window.SVGM_BOOT = /*BOOT*/;</script>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v4h4"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></symbol>
  <symbol id="i-plate" viewBox="0 0 24 24"><path d="M3 15l9 5 9-5-9-5zM12 10V4"/></symbol>
  <symbol id="i-wand" viewBox="0 0 24 24"><path d="M4 20 16 8M14 4v2M20 10h-2M18 4l-1.5 1.5M10 4l.8 1.6"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5zM3 13l9 5 9-5"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8M14 5v4M8 15v4"/></symbol>
</svg>

<div class="page" id="app">
  <aside class="side">
    <!-- SVG ---------------------------------------------------------------->
    <section class="sec">
      <div class="sec-head">
        <svg class="ic" aria-hidden="true"><use href="#i-file"/></svg>
        <h3 data-i18n="src.title">SVG file</h3>
        <button type="button" class="flat" id="btn_svg_pick" data-i18n="src.browse">Browse…</button>
      </div>
      <div class="file-line" id="svg_line" title="">
        <span id="svg_name" data-i18n="src.none">No SVG chosen</span>
      </div>
      <p class="note err" id="pick_fallback" hidden>
        <span id="pick_error"></span>
        <a href="#" id="btn_svg_upload" data-i18n="src.upload">Upload a copy…</a>
      </p>
      <input type="file" id="svg_file" accept=".svg,image/svg+xml" hidden>

      <label class="row"><span data-i18n="opt.size">Size</span>
        <span class="ctl two">
          <select id="size_mode" data-opt="size_mode">
            <option value="width" data-i18n="opt.size_width">Width</option>
            <option value="height" data-i18n="opt.size_height">Height</option>
            <option value="original" data-i18n="opt.size_original">Original size</option>
          </select>
          <span class="unit" data-unit="mm"><input id="size_mm" type="number" min="1" step="1" data-opt="size_mm"></span>
        </span></label>
      <label class="row"><span data-i18n="opt.thickness">Color thickness</span>
        <span class="ctl"><span class="unit" data-unit="mm"><input id="thickness_mm" type="number" min="0.04" step="0.04" data-opt="thickness_mm"></span></span></label>
      <label class="row"><span data-i18n="opt.max_colors">Max. colors</span>
        <span class="ctl"><input id="max_colors" type="number" min="0" max="64" step="1" data-opt="max_colors"
              data-i18n-title="opt.max_colors_hint"></span></label>
    </section>

    <!-- COLORS ------------------------------------------------------------->
    <section class="sec">
      <div class="sec-head">
        <svg class="ic" aria-hidden="true"><use href="#i-layers"/></svg>
        <h3 data-i18n="opt.colors_section">Colors</h3>
        <span class="count" id="colors_count"></span>
        <button type="button" class="flat icon" id="btn_auto_fil" data-i18n-title="col.auto" title="Match filaments by color" hidden>
          <svg class="ic"><use href="#i-wand"/></svg></button>
      </div>
      <div class="colors" id="colors" role="list"></div>
      <p class="note" id="colors_empty" data-i18n="prev.empty">Choose an SVG to see how it will be split.</p>
      <p class="note warn" id="colors_note" hidden></p>
    </section>

    <!-- TARGET ------------------------------------------------------------->
    <section class="sec">
      <div class="sec-head">
        <svg class="ic" aria-hidden="true"><use href="#i-plate"/></svg>
        <h3 data-i18n="target.title">Apply to</h3>
      </div>
      <label class="radio"><input type="radio" name="target" value="plate" checked>
        <span data-i18n="target.plate">An object on the plate</span></label>
      <div class="sub" id="target_plate">
        <div class="ctl wide">
          <select id="plate_object" data-i18n-aria="plate.object"></select>
          <button type="button" class="flat icon" id="btn_plate_read" data-i18n-title="plate.read" title="Read the plate again">
            <svg class="ic"><use href="#i-refresh"/></svg></button>
        </div>
        <p class="note" id="plate_state"></p>
        <p class="note" data-i18n="plate.hint">The design goes into the saved project, which reopens here with the new parts. Save the project (Ctrl+S) first.</p>
        <label class="row"><span data-i18n="apply.fit">Placement</span>
          <span class="ctl"><select id="fit" data-opt="fit">
            <option value="inlay" data-i18n="apply.fit_inlay">Inlaid in the top</option>
            <option value="raised" data-i18n="apply.fit_raised">Raised on the top</option>
          </select></span></label>
        <label class="row"><span data-i18n="apply.width">Width</span>
          <span class="ctl"><span class="unit" data-unit="mm"><input id="apply_width_mm" type="number" min="0" step="1"
                data-opt="apply_width_mm" data-i18n-ph="apply.auto" placeholder="auto"></span></span></label>
      </div>

      <label class="radio"><input type="radio" name="target" value="new">
        <span data-i18n="target.new">A new object on the plate</span></label>
      <div class="sub" id="target_new" hidden>
        <label class="row"><span data-i18n="base.section">Base plate</span>
          <span class="ctl"><span class="unit" data-unit="mm"><input id="base_thickness_mm" type="number" min="0" step="0.2"
                data-opt="base_thickness_mm" data-i18n-title="base.hint"></span></span></label>
        <div id="base_opts">
          <label class="row"><span data-i18n="base.margin">Margin</span>
            <span class="ctl"><span class="unit" data-unit="mm"><input id="base_margin_mm" type="number" min="0" step="0.5" data-opt="base_margin_mm"></span></span></label>
          <label class="row"><span data-i18n="base.shape">Shape</span>
            <span class="ctl"><select id="base_shape" data-opt="base_shape">
              <option value="outline" data-i18n="base.shape_outline">Follow the outline</option>
              <option value="rectangle" data-i18n="base.shape_rect">Rounded rectangle</option>
            </select></span></label>
          <label class="row"><span data-i18n="base.filament">Filament</span>
            <span class="ctl"><select id="base_filament" data-opt="base_filament"></select></span></label>
        </div>
      </div>
    </section>

    <!-- ADVANCED ----------------------------------------------------------->
    <details class="sec adv" id="adv">
      <summary class="sec-head">
        <svg class="ic" aria-hidden="true"><use href="#i-sliders"/></svg>
        <h3 data-i18n="adv.section">Advanced</h3>
      </summary>
      <label class="row"><span data-i18n="opt.merge">Merge similar tones</span>
        <span class="ctl"><input id="merge_tolerance" type="range" min="0" max="30" step="1" data-opt="merge_tolerance"
              data-i18n-title="opt.merge_hint"><output id="merge_out" class="out-val"></output></span></label>
      <label class="row"><span data-i18n="opt.strokes">Include outlines (strokes)</span>
        <span class="ctl"><input type="checkbox" id="include_strokes" data-opt="include_strokes"></span></label>
      <label class="row"><span data-i18n="adv.precision">Precision</span>
        <span class="ctl"><span class="unit" data-unit="mm"><input id="precision_mm" type="number" min="0" step="0.01"
              data-opt="precision_mm" data-i18n-title="adv.hint"></span></span></label>
      <label class="row"><span data-i18n="adv.min_area">Ignore specks under</span>
        <span class="ctl"><span class="unit" data-unit="mm²"><input id="min_area_mm2" type="number" min="0" step="0.01" data-opt="min_area_mm2"></span></span></label>
      <label class="row"><span data-i18n="adv.min_detail">Remove details thinner than</span>
        <span class="ctl"><span class="unit" data-unit="mm"><input id="min_detail_mm" type="number" min="0" step="0.05"
              data-opt="min_detail_mm" data-i18n-title="adv.min_detail_hint"></span></span></label>
    </details>
  </aside>

  <main class="canvas">
    <div class="canvas-bar">
      <div class="seg" role="tablist" id="view_seg">
        <button type="button" role="tab" data-view="result" aria-selected="true" data-i18n="prev.result">Result</button>
        <button type="button" role="tab" data-view="original" aria-selected="false" data-i18n="prev.original">Original</button>
      </div>
      <span class="dims" id="dims"></span>
      <span class="spacer"></span>
      <button type="button" class="primary" id="btn_run"><span id="btn_run_label" data-i18n="out.apply_plate">Apply to the plate</span></button>
    </div>

    <div class="preview" id="preview" aria-live="polite">
      <div class="empty" id="preview_empty">
        <svg class="ic big" aria-hidden="true"><use href="#i-layers"/></svg>
        <p data-i18n="prev.empty">Choose an SVG to see how it will be split.</p>
      </div>
      <div class="stage" id="preview_result" hidden></div>
      <img class="stage" id="preview_original" alt="" hidden>
      <div class="spinner" id="preview_spin" hidden></div>
    </div>

    <ul class="warnings" id="warnings" hidden></ul>

    <div class="status" id="status">
      <div class="bar" id="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><span id="bar_fill"></span></div>
      <span class="dot" id="status_dot"></span>
      <span class="status-text" id="status_text" aria-live="polite" data-i18n="status.ready">Ready.</span>
      <a href="#" id="btn_open_folder" hidden data-i18n="status.open_folder">Open folder</a>
    </div>
  </main>
</div>

<script>/*JS*/</script>
